name: Build TWRP recovery.img (EEBBK P21H170)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 default-jdk bc lz4

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest (Android 11 / twrp-11)
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          ~/bin/repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Place device tree
        run: |
          mkdir -p ~/twrp/device/EEBBK
          rm -rf ~/twrp/device/EEBBK/P21H170
          cp -r "$GITHUB_WORKSPACE/device/EEBBK/P21H170" ~/twrp/device/EEBBK/P21H170
          ls -la ~/twrp/device/EEBBK/P21H170

      - name: Build recovery.img
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch twrp_P21H170-eng
          mka recoveryimage -j"$(nproc)"
          df -h /

      - name: Show outputs
        run: |
          ls -la ~/twrp/out/target/product/P21H170/ || true

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery-P21H170
          path: |
            ~/twrp/out/target/product/P21H170/recovery.img
            ~/twrp/out/target/product/P21H170/recovery.img.*
          if-no-files-found: error
          retention-days: 30
